<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2A4A"/>
      <stop offset="100%" style="stop-color:#1A3F6F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00C8FF"/>
      <stop offset="100%" style="stop-color:#0080FF"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- TV / screen shape -->
  <rect x="5" y="8" width="22" height="14" rx="2" fill="none" stroke="url(#accent)" stroke-width="1.8"/>

  <!-- Screen inner glow -->
  <rect x="7" y="10" width="18" height="10" rx="1" fill="#00C8FF" opacity="0.08"/>

  <!-- Signal waves / tech lines inside screen -->
  <polyline points="9,17 11,13 13,16 15,12 17,15 19,11 21,14 23,17" fill="none" stroke="url(#accent)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stand -->
  <line x1="16" y1="22" x2="16" y2="25" stroke="#00C8FF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="12" y1="25" x2="20" y2="25" stroke="#00C8FF" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Top-right dot accent -->
  <circle cx="26" cy="7" r="2.5" fill="#00C8FF" opacity="0.9"/>
  <circle cx="26" cy="7" r="1.2" fill="#ffffff"/>
</svg>
